openapi: 3.0.3
info:
  title: Mock DCOTA API
  version: 1.0.0
  description: >
    Contract implemented by mock-server/server.js and consumed by the iOS app's
    RemoteDCOTAService. Use it as the source of truth for contract tests.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/fleet/summary:
    get:
      operationId: getFleetSummary
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FleetSummary' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/devices:
    get:
      operationId: listDevices
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: search, in: query, schema: { type: string }, description: Matches serial, model or store name (case-insensitive) }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/DeviceStatus' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DevicePage' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/devices/{id}:
    get:
      operationId: getDevice
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/stores:
    get:
      operationId: listStores
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Store' } } } } }
  /api/v1/packages:
    get:
      operationId: listPackages
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ContentPackage' } } } } }
  /api/v1/deployments:
    get:
      operationId: listDeployments
      description: Newest first. Polling this endpoint advances simulated deployment progress.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Deployment' } } } } }
    post:
      operationId: createDeployment
      description: >
        Rules: package must exist (404); 1..10 distinct existing stores (400);
        the same package must not already be active (scheduled/inProgress) in any target store (409).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateDeploymentRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Deployment' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/deployments/{id}/cancel:
    post:
      operationId: cancelDeployment
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Deployment' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [VALIDATION_ERROR, NOT_FOUND, CONFLICT, SERVER_ERROR] }
        message: { type: string }
    DeviceStatus: { type: string, enum: [online, offline, updating, failed] }
    DeploymentStatus: { type: string, enum: [scheduled, inProgress, completed, failed, cancelled] }
    FleetSummary:
      type: object
      required: [totalDevices, online, offline, updating, failed, activeDeployments]
      description: online + offline + updating + failed == totalDevices
      properties:
        totalDevices: { type: integer }
        online: { type: integer }
        offline: { type: integer }
        updating: { type: integer }
        failed: { type: integer }
        activeDeployments: { type: integer }
    Store:
      type: object
      required: [id, name, city, partner, deviceCount]
      properties:
        id: { type: string }
        name: { type: string }
        city: { type: string }
        partner: { type: string }
        deviceCount: { type: integer }
    Device:
      type: object
      required: [id, serialNumber, model, osVersion, storeID, storeName, status, lastCheckIn]
      properties:
        id: { type: string }
        serialNumber: { type: string }
        model: { type: string }
        osVersion: { type: string }
        storeID: { type: string }
        storeName: { type: string }
        status: { $ref: '#/components/schemas/DeviceStatus' }
        contentVersion: { type: string, nullable: true }
        lastCheckIn: { type: string, format: date-time, description: ISO-8601 UTC without fractional seconds }
    DevicePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Device' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    ContentPackage:
      type: object
      required: [id, name, version, sizeMB, category]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        sizeMB: { type: integer }
        category: { type: string }
    CreateDeploymentRequest:
      type: object
      required: [packageID, storeIDs]
      properties:
        packageID: { type: string }
        storeIDs: { type: array, items: { type: string } }
    Deployment:
      type: object
      required: [id, packageID, packageName, packageVersion, storeIDs, deviceCount, status, progress, createdAt]
      properties:
        id: { type: string }
        packageID: { type: string }
        packageName: { type: string }
        packageVersion: { type: string }
        storeIDs: { type: array, items: { type: string } }
        deviceCount: { type: integer }
        status: { $ref: '#/components/schemas/DeploymentStatus' }
        progress: { type: number, minimum: 0, maximum: 1 }
        createdAt: { type: string, format: date-time }
