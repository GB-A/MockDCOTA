name: MockDCOTA
options:
  bundleIdPrefix: com.example.mockdcota
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MockDCOTA:
    type: application
    platform: iOS
    sources:
      - App
      - Models
      - Services
      - ViewModels
      - Views
      - Support
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mockdcota.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: MockDCOTA
        INFOPLIST_FILE: Support/Info.plist   # ATS exception for the local mock server
    # Test targets are intentionally NOT defined here: they live in your separate
    # GitHub test project, which builds/launches this app (see README).
schemes:
  MockDCOTA:
    build:
      targets:
        MockDCOTA: all
    run:
      config: Debug
    archive:
      config: Release
